name: Miguel Del Valle
role: Economist
bio:
  - >-
    I am an economist with a <strong>Bachelor's and a Master's degree</strong>
    from <em>Universidad de Chile</em>. My research interests are
    <strong>spatial economics, production networks, and international
    trade.</strong>
  - >-
    I combine <strong>data built from administrative microdata, surveys, and
    international datasets</strong> with general equilibrium quantitative
    models.
  - >-
    My work focuses on understanding the <strong>aggregate and distributional
    consequences</strong> of productivity shocks, infrastructure investment,
    natural disasters, and other economic events. I use this evidence to
    inform policy design aimed at mitigating welfare losses and increasing
    welfare gains.
  - I plan to apply to PhD programs in Economics this year.
research_areas:
  - Spatial Economics
  - Production Networks
  - International Trade
